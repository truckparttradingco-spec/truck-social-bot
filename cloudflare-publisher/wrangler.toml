name = "truck-part-auto-publisher"
main = "src/index.ts"
compatibility_date = "2026-11-23"

[vars]
META_API_VERSION = "v26.0"
APP_TIMEZONE = "Asia/Tehran"
POSTING_SLOTS = "10:00,14:00,17:00"

[[d1_databases]]
binding = "DB"
database_name = "truck-part-publisher"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "truck-part-publisher-media"

[triggers]
crons = ["* * * * *"]
