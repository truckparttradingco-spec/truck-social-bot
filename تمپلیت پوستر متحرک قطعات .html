function synth(ac,out,k,D){const b=60/[118,90,100][k-1],t0=ac.currentTime+.05,R=[[220,175,196,165],[196,147,165,220],[175,220,196,262]][k-1],g=ac.createGain();g.gain.setValueAtTime(.45,t0);g.gain.setValueAtTime(.45,t0+D-.7);g.gain.linearRampToValueAtTime(0,t0+D);g.connect(out);
