  abs:        {title_fa: "رینگ ای‌بی‌اس", title: "ABS Tone Rings",             group: "Brake System", tags: ["abs", "tonering", "wheelspeed"]}
  adj:        {title_fa: "اتوماتیک ترمز", title: "Brake Adjusters",            group: "Brake System", tags: ["brakeadjuster", "slackadjuster"]}
  air:        {title_fa: "کیسه باد", title: "Air Springs",                group: "Suspension",   tags: ["airspring", "airbag", "suspension"]}
  bearing:    {title_fa: "بلبرینگ چرخ", title: "Tapered Roller Bearings",    group: "Wheel-End",    tags: ["bearings", "wheelbearing", "taperedbearing"]}
  bolt:       {title_fa: "پیچ چرخ", title: "Wheel Bolts",                group: "Wheel-End",    tags: ["wheelbolt", "fasteners", "hubbolt"]}
