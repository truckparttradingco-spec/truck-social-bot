# =====================================================================
#  تنظیمات ربات تبلیغاتی Truck Part Trading
#  فقط همین فایل را ویرایش کنید؛ کلیدها و توکن‌ها در فایل .env می‌روند.
# =====================================================================

brand:
  name: "Truck Part Trading"
  website: "www.truckparttrading.com"       # همان‌طور که روی عکس‌ها چاپ می‌شود
  website_url: "https://www.truckparttrading.com"   # لینک قابل کلیک (فیسبوک/تلگرام)
  tagline: "Heavy-duty truck & trailer parts"
  cta: "REQUEST A QUOTE"                    # متن دکمه روی عکس
  footer_line: "Send us the part number for availability & price"   # خط زیر عنوان روی عکس
  # اطلاعات تماس: هر کدام را که پر کنید روی عکس و کپشن می‌آید (خالی = نمایش داده نمی‌شود)
  phone: "021-55282160-61"
  whatsapp: "09120745582"        # شماره‌ها را از روی قالب‌هایتان برداشته‌ام؛ اصلاح کنید
  email: ""
  instagram: "@export.truckpart"
  # لوگو (اختیاری): فایل PNG شفاف را اینجا بگذارید. اگر نباشد، حروف اول اسم برند ساخته می‌شود.
  logo: "assets/logo.png"

schedule:
  timezone: "UTC"              # مثلا Europe/Berlin یا Asia/Tehran یا Asia/Dubai
  posts: ["10:00", "18:00"]    # دو پست روزانه (به وقت timezone بالا)
  story_with_each_post: true   # برای هر پست یک استوری هم منتشر شود
  grace_minutes: 120           # اگر برنامه سر ساعت روشن نبود، تا این مدت بعد هنوز پست می‌کند

platforms:
  instagram: true
  facebook: true
  telegram: true
  # تلگرام برای کانال‌ها API استوری ندارد؛ فقط پست ارسال می‌شود.

hosting:
  # اینستاگرام عکس را فقط از «لینک عمومی» می‌گیرد، نه از فایل.
  # none       = فقط برای تست / وقتی اینستاگرام خاموش است
  # cloudinary = آپلود خودکار روی Cloudinary (رایگان) - مقادیر در .env
  # static     = پوشه output را خودتان روی یک وب‌سرور عمومی سرو می‌کنید
  mode: "cloudinary"
  public_base_url: ""          # فقط برای mode: static   مثال: https://example.com/social

captions:
  max_hashtags_instagram: 15
  base_hashtags: ["trucks", "truckparts", "heavyduty", "trailerparts", "spareparts", "aftermarket", "trucking", "fleet"]

selection:
  exclude_file_names: ["pack"]     # عکس‌های جعبه (pack.png) در چرخه پست نمی‌آیند
  exclude_categories: []

graph_api_version: "v23.0"         # اگر متا نسخه را منسوخ کرد، آخرین نسخه را اینجا بگذارید


# ---------------------------------------------------------------------
#  قالب‌های پوستر (فایل‌های PSD شما) - پوشه templates/
#  هر دسته‌ای که اینجا اسم قالب داشته باشد با همان قالب پست می‌شود؛
#  بقیه دسته‌ها با طرح خودکار (بدون قالب) ساخته می‌شوند.
#  قالب‌ها: abs adj bearing bolt(wega_bolt) shock wega china afre_disc afre_seal nok kaan kaan_seal egd
# ---------------------------------------------------------------------
templates:
  # هر دسته: یا اسم یک قالب، یا جدولی از «برند → قالب» (برند از اطلاعات محصول خوانده می‌شود).
  # برند بدون قالب (یا "*" نبودن) = طرح خودکار.
  abs: abs                    # HUMMER ABS Ring
  adj: adj                    # HUMMER Brake Adjuster
  bearing: bearing            # HUMMER Bearing
  bolt: wega_bolt             # WEGA Wheel Bolt
  shock: shock                # HUMMER Shock Absorber
  suspension: wega            # WEGA Air Suspension
  china: china                # ORGINAL Chinese Truck Caliper
  howo: {ORGINAL: china}
  disc: {AFRE: afre_disc}     # AFRE Brake Disc
  seal: {NOK: nok, KAAN: kaan_seal, AFRE: afre_seal}
  kaan: {KAAN: kaan, EGD: egd, EGD FREN: egd}
  bremse: {EGD FREN: egd, EGD: egd, KAAN: kaan}
  bpnew: {EGD FREN: egd, EGD: egd}
  bpw: {EGD FREN: egd, EGD: egd}
  holland: {EGD FREN: egd, EGD: egd}
  meritor: {EGD FREN: egd, EGD: egd}
  wabco: {EGD FREN: egd, EGD: egd}
  zcam: {EGD FREN: egd, EGD: egd}

poster:
  use_templates: true   # false = همه پست‌ها با طرح خودکار
  # مقدار پیش‌فرض خانه‌هایی که برای آن محصول داده‌ای ندارید (خالی = «-»)
  defaults: {}

# ---------------------------------------------------------------------
#  دسته‌ها = نام پوشه‌ها داخل products/
#  اسم‌ها را من از روی شکل عکس‌ها حدس زده‌ام؛ حتما بازبینی و اصلاح کنید.
# ---------------------------------------------------------------------
